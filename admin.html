<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Aime Christian</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="robots" content="noindex" />
  
  <style>
    body { background: #0a0a0a; color: white; }
    .glass-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
    }
  </style>
</head>
<body class="min-h-screen bg-black text-white">
      <div class="max-w-4xl mx-auto p-6">

    <!-- Login -->
    <div id="loginSection" class="glass-card p-8 max-w-md mx-auto mt-20">
      <h1 class="text-3xl font-bold text-center mb-8">Admin Login</h1>
      <form id="loginForm">
        <input type="text" id="adminUser" placeholder="Username" class="w-full mb-4 p-4 bg-zinc-900 rounded-xl" required />
        <input type="password" id="adminPass" placeholder="Password" class="w-full mb-6 p-4 bg-zinc-900 rounded-xl" required />
        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 py-4 rounded-xl font-semibold">Login</button>
      </form>
      <p id="loginError" class="text-red-500 text-center mt-4 hidden"></p>
    </div>

    <!-- Admin Main -->
    <div id="uploadSection" class="hidden">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
        <h1 class="text-3xl font-bold">Admin</h1>
        <button id="logoutBtn" class="px-6 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl">Logout</button>
      </div>

      <div class="grid lg:grid-cols-2 gap-6">

        <!-- Payment verification -->
        <div class="glass-card p-6">
          <div class="flex items-start justify-between gap-4 mb-4">
            <div>
              <h2 class="text-xl font-semibold">Verify Payments</h2>
              <p class="text-sm text-zinc-400 mt-1">Confirm pending MoMo registrations to grant access.</p>
            </div>
            <button id="refreshPaymentsBtn" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-sm">Refresh</button>
          </div>

          <div id="paymentList" class="space-y-4"></div>
        </div>

        <!-- Upload Documentary -->
        <div class="glass-card p-8">
          <form id="uploadForm">
          <div class="mb-6">
            <label class="block text-sm mb-2">Documentary Title</label>
            <input type="text" id="title" placeholder="Enter documentary title" class="w-full p-4 bg-zinc-900 rounded-xl" required />
          </div>

          <div class="mb-6">
            <label class="block text-sm mb-2">Summary</label>
            <textarea id="summary" rows="4" placeholder="Write a short summary..." class="w-full p-4 bg-zinc-900 rounded-xl resize-y"></textarea>
          </div>

          <div class="mb-6">
            <label class="block text-sm mb-2">Video File</label>
            <input type="file" id="videoFile" accept="video/*" class="w-full p-4 bg-zinc-900 rounded-xl" required />
          </div>

          <div id="progressContainer" class="hidden mb-4">
            <div class="h-2 bg-zinc-800 rounded-full overflow-hidden">
              <div id="progressBar" class="h-full bg-red-600 w-0 transition-all"></div>
            </div>
            <p id="progressText" class="text-sm text-center mt-1">0%</p>
          </div>

          <button type="submit" id="uploadBtn" class="w-full bg-red-600 hover:bg-red-700 py-4 rounded-xl font-semibold text-lg">
            Upload Documentary
          </button>
        </form>
      </div>

      <div class="mt-10">
        <h2 class="text-xl font-semibold mb-4">Current Documentaries</h2>
        <button id="refreshListBtn" class="mb-4 px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-sm">Refresh List</button>
        <div id="docList" class="space-y-4"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // admin.html (Firestore-backed) - payments verification + documentary upload UI


// ===============================================
// admin.js - Full Updated Version
// ===============================================

let allPayments = [];
let allDocumentaries = [];

// Utility
function normalizePhone(phone) {
  return String(phone || '').replace(/\D/g, '');
}

async function apiFetch(url, options = {}) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    ...options
  });
  if (!res.ok) throw new Error(await res.text() || 'Request failed');
  return res.json();
}

// ====================== AUTH ======================
async function adminLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!username || !password) {
    alert("Please enter username and password");
    return;
  }

  try {
    const data = await apiFetch('/api/admin/login', {
      method: 'POST',
      body: JSON.stringify({ username, password })
    });

    if (data.success) {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('adminDashboard').classList.remove('hidden');
      loadAdminData();
    }
  } catch (err) {
    alert("Login failed: " + err.message);
  }
}

function adminLogout() {
  fetch('/api/admin/logout', { method: 'POST' })
    .then(() => {
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('adminDashboard').classList.add('hidden');
    });
}

// ====================== PAYMENTS ======================
async function loadPayments() {
  try {
    const res = await fetch('/api/payments'); // We'll add this route if needed, or use existing logic
    // For now, assuming we fetch from same storage
    const paymentsRes = await fetch('/api/admin/payments'); // You may need to add this route
    allPayments = await paymentsRes.json();
    renderPayments();
  } catch (e) {
    console.error(e);
    allPayments = [];
  }
}

function renderPayments() {
  const tbody = document.getElementById('paymentsTableBody');
  if (!tbody) return;

  tbody.innerHTML = allPayments.map(payment => `
    <tr class="border-b border-zinc-700 hover:bg-zinc-800">
      <td class="px-4 py-3">${payment.fullName}</td>
      <td class="px-4 py-3">${payment.phone}</td>
      <td class="px-4 py-3">${payment.planType}</td>
      <td class="px-4 py-3">${payment.amount} RWF</td>
      <td class="px-4 py-3">
        <span class="px-3 py-1 rounded-full text-xs font-medium
          ${payment.status === 'confirmed' ? 'bg-green-500/20 text-green-400' : 
            payment.status === 'pending' ? 'bg-yellow-500/20 text-yellow-400' : 'bg-red-500/20 text-red-400'}">
          ${payment.status}
        </span>
      </td>
      <td class="px-4 py-3">
        ${payment.screenshotUrl ? 
          `<a href="${payment.screenshotUrl}" target="_blank" class="text-blue-400 hover:underline">View Screenshot</a>` : 
          '<span class="text-zinc-500">No screenshot</span>'}
      </td>
      <td class="px-4 py-3">
        ${payment.status === 'pending' ? `
          <button onclick="verifyPayment('${payment.id}')" 
            class="bg-green-600 hover:bg-green-700 px-4 py-1 rounded-lg text-sm">
            Verify
          </button>` : ''}
      </td>
    </tr>
  `).join('');
}

async function verifyPayment(paymentId) {
  if (!confirm("Mark this payment as confirmed?")) return;

  try {
    await apiFetch('/api/admin/verify-payment', {
      method: 'POST',
      body: JSON.stringify({ paymentId })
    });
    alert("Payment verified successfully!");
    loadPayments();
  } catch (err) {
    alert("Failed to verify: " + err.message);
  }
}

// ====================== DOCUMENTARIES ======================
async function loadDocumentaries() {
  try {
    const res = await fetch('/api/documentaries');
    allDocumentaries = await res.json();
    renderDocumentaries();
  } catch (e) {
    console.error(e);
  }
}

function renderDocumentaries() {
  const container = document.getElementById('documentariesList');
  if (!container) return;

  container.innerHTML = allDocumentaries.map(doc => `
    <div class="glass-card p-4 rounded-xl">
      <div class="flex gap-4">
        <img src="${doc.thumbnail || 'https://via.placeholder.com/120x70'}" 
             class="w-32 h-20 object-cover rounded-lg">
        <div class="flex-1">
          <h4 class="font-semibold">${doc.title}</h4>
          <p class="text-sm text-zinc-400 mt-1 line-clamp-2">${doc.summary}</p>
          <a href="${doc.cloudinaryUrl}" target="_blank" 
             class="text-blue-400 text-sm hover:underline mt-2 inline-block">
            View Video →
          </a>
        </div>
      </div>
    </div>
  `).join('');
}

// Upload Documentary
async function handleDocumentaryUpload(e) {
  e.preventDefault();

  const title = document.getElementById('docTitle').value.trim();
  const summary = document.getElementById('docSummary').value.trim();
  const fileInput = document.getElementById('docVideo');
  const file = fileInput.files[0];

  if (!title || !file) {
    alert("Title and video file are required");
    return;
  }

  const formData = new FormData();
  formData.append('title', title);
  formData.append('summary', summary);
  formData.append('video', file);

  try {
    const res = await fetch('/api/upload-documentary', {
      method: 'POST',
      body: formData
    });

    const data = await res.json();

    if (data.success) {
      alert("Documentary uploaded successfully!");
      document.getElementById('docUploadForm').reset();
      loadDocumentaries();
    } else {
      alert(data.error || "Upload failed");
    }
  } catch (err) {
    alert("Error uploading documentary: " + err.message);
  }
}

// ====================== LOAD ALL DATA ======================
async function loadAdminData() {
  await Promise.all([loadPayments(), loadDocumentaries()]);
}

// ====================== INIT ======================
function initAdmin() {
  // Login form
  const loginForm = document.getElementById('loginForm');
  if (loginForm) loginForm.addEventListener('submit', (e) => { e.preventDefault(); adminLogin(); });

  // Documentary upload form
  const docForm = document.getElementById('docUploadForm');
  if (docForm) docForm.addEventListener('submit', handleDocumentaryUpload);

  // Check if already logged in
  fetch('/api/admin/check')
    .then(res => res.json())
    .then(data => {
      if (data.isLoggedIn) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminDashboard').classList.remove('hidden');
        loadAdminData();
      }
    })
    .catch(() => {});

  console.log('Admin panel initialized');
}

document.addEventListener('DOMContentLoaded', initAdmin);
  </script>
</body>
</html>
