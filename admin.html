<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Aime Christian</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="robots" content="noindex" />
  
  <style>
    body { background: #0a0a0a; color: white; }
    .glass-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
    }
  </style>
</head>
<body class="min-h-screen bg-black text-white">
  <div class="max-w-4xl mx-auto p-6">

    <!-- Login -->
    <div id="loginSection" class="glass-card p-8 max-w-md mx-auto mt-20">
      <h1 class="text-3xl font-bold text-center mb-8">Admin Login</h1>
      <form id="loginForm">
        <input type="text" id="adminUser" placeholder="Username" class="w-full mb-4 p-4 bg-zinc-900 rounded-xl" required />
        <input type="password" id="adminPass" placeholder="Password" class="w-full mb-6 p-4 bg-zinc-900 rounded-xl" required />
        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 py-4 rounded-xl font-semibold">Login</button>
      </form>
      <p id="loginError" class="text-red-500 text-center mt-4 hidden"></p>
    </div>

    <!-- Admin Main -->
    <div id="uploadSection" class="hidden">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
        <h1 class="text-3xl font-bold">Admin</h1>
        <button id="logoutBtn" class="px-6 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl">Logout</button>
      </div>

      <div class="grid lg:grid-cols-2 gap-6">

        <!-- Payment verification -->
        <div class="glass-card p-6">
          <div class="flex items-start justify-between gap-4 mb-4">
            <div>
              <h2 class="text-xl font-semibold">Verify Payments</h2>
              <p class="text-sm text-zinc-400 mt-1">Confirm pending MoMo registrations to grant access.</p>
            </div>
            <button id="refreshPaymentsBtn" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-sm">Refresh</button>
          </div>
          <div id="paymentList" class="space-y-4"></div>
        </div>

        <!-- Upload Documentary -->
        <div class="glass-card p-8">
          <h2 class="text-xl font-semibold mb-6">Upload New Documentary</h2>
          <form id="uploadForm" enctype="multipart/form-data">
            <div class="mb-6">
              <label class="block text-sm mb-2">Documentary Title</label>
              <input type="text" id="title" placeholder="Enter documentary title" class="w-full p-4 bg-zinc-900 rounded-xl" required />
            </div>
            <div class="mb-6">
              <label class="block text-sm mb-2">Summary</label>
              <textarea id="summary" rows="4" placeholder="Short summary of the documentary" class="w-full p-4 bg-zinc-900 rounded-xl"></textarea>
            </div>
            <div class="mb-8">
              <label class="block text-sm mb-2">Video File (MP4)</label>
              <input type="file" id="videoFile" accept="video/*" class="w-full p-4 bg-zinc-900 rounded-xl" required />
            </div>
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 py-4 rounded-xl font-semibold">Upload to Cloudinary</button>
          </form>
        </div>

      </div>

      <!-- Documentaries List -->
      <div class="mt-10">
        <h2 class="text-xl font-semibold mb-4">Uploaded Documentaries</h2>
        <div id="docList" class="space-y-4"></div>
      </div>
    </div>
  </div>

  <script>
    // ===============================================
    // Admin Panel - Updated with Cloudinary + Backend
    // ===============================================

    const loginSection = document.getElementById('loginSection');
    const uploadSection = document.getElementById('uploadSection');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');
    const refreshPaymentsBtn = document.getElementById('refreshPaymentsBtn');
    const uploadForm = document.getElementById('uploadForm');

    // ====================== AUTH ======================
    async function checkAuth() {
      try {
        const res = await fetch('/api/admin/check');
        const data = await res.json();
        if (data.isLoggedIn) {
          loginSection.classList.add('hidden');
          uploadSection.classList.remove('hidden');
          loadPayments();
          loadDocumentaries();
        }
      } catch (e) {}
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('adminUser').value.trim();
      const password = document.getElementById('adminPass').value.trim();

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          loginError.classList.add('hidden');
          loginSection.classList.add('hidden');
          uploadSection.classList.remove('hidden');
          loadPayments();
          loadDocumentaries();
        } else {
          throw new Error(data.error || 'Login failed');
        }
      } catch (err) {
        loginError.textContent = err.message;
        loginError.classList.remove('hidden');
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try { await fetch('/api/admin/logout', { method: 'POST' }); } catch {}
      window.location.reload();
    });

    // ====================== PAYMENTS ======================
    async function loadPayments() {
      try {
        const res = await fetch('/api/admin/payments');
        const payments = await res.json();
        renderPayments(payments);
      } catch (e) {
        console.error(e);
      }
    }

    function renderPayments(payments) {
      const container = document.getElementById('paymentList');
      container.innerHTML = payments.map(p => `
        <div class="glass-card p-4 flex flex-col sm:flex-row sm:items-center gap-4">
          <div class="flex-1">
            <p><strong>${p.fullName}</strong> — ${p.phone}</p>
            <p class="text-sm text-zinc-400">${p.planType} • ${p.amount} RWF</p>
          </div>
          <div>
            ${p.screenshotUrl ? 
              `<a href="${p.screenshotUrl}" target="_blank" class="text-blue-400 underline">View Proof</a>` : 
              `<span class="text-yellow-400">No proof yet</span>`}
          </div>
          <div>
            ${p.status === 'pending' ? `
              <button onclick="verifyPayment('${p.id}')" 
                class="bg-green-600 hover:bg-green-700 px-5 py-2 rounded-xl text-sm">
                Verify
              </button>` : 
              `<span class="text-green-400">✓ Confirmed</span>`}
          </div>
        </div>
      `).join('');
    }

    window.verifyPayment = async function(paymentId) {
      if (!confirm("Confirm this payment?")) return;
      try {
        await fetch('/api/admin/verify-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentId })
        });
        loadPayments();
      } catch (err) {
        alert("Verification failed");
      }
    };

    refreshPaymentsBtn.addEventListener('click', loadPayments);

    // ====================== DOCUMENTARIES ======================
    async function loadDocumentaries() {
      try {
        const res = await fetch('/api/documentaries');
        const docs = await res.json();
        renderDocumentaries(docs);
      } catch (e) {
        console.error(e);
      }
    }

    function renderDocumentaries(docs) {
      const container = document.getElementById('docList');
      container.innerHTML = docs.map(doc => `
        <div class="glass-card p-4 flex gap-4">
          <img src="${doc.thumbnail || 'https://via.placeholder.com/120x70'}" class="w-28 h-20 object-cover rounded-lg">
          <div class="flex-1">
            <h4 class="font-semibold">${doc.title}</h4>
            <p class="text-sm text-zinc-400 line-clamp-2">${doc.summary}</p>
            <a href="${doc.cloudinaryUrl}" target="_blank" class="text-blue-400 text-sm mt-2 inline-block hover:underline">
              Watch Video →
            </a>
          </div>
        </div>
      `).join('');
    }

    // Upload Documentary to Cloudinary via Backend
    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('title').value.trim();
      const summary = document.getElementById('summary').value.trim();
      const file = document.getElementById('videoFile').files[0];

      if (!title || !file) {
        alert("Title and video file are required");
        return;
      }

      const formData = new FormData();
      formData.append('title', title);
      formData.append('summary', summary);
      formData.append('video', file);

      try {
        const res = await fetch('/api/upload-documentary', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (data.success) {
          alert("Documentary uploaded successfully!");
          uploadForm.reset();
          loadDocumentaries();
        } else {
          alert(data.error || "Upload failed");
        }
      } catch (err) {
        alert("Error: " + err.message);
      }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      checkAuth();
    });
  </script>
</body>
</html>
