name: Encode video to HLS

on:
  repository_dispatch:
    types: [encode-video]
  workflow_dispatch:
    inputs:
      r2_key:
        description: 'Full R2 key of the master video'
        required: true
      documentary_id:
        description: 'Documentary ID'
        required: true

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Install FFmpeg & AWS CLI v2
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version
      - name: Debug secrets (temporary)
        run: |
          echo "R2_ACCESS_KEY_ID is set: ${{ secrets.R2_ACCESS_KEY_ID != '' }}"
          echo "R2_SECRET_ACCESS_KEY is set: ${{ secrets.R2_SECRET_ACCESS_KEY != '' }}"
          echo "R2_ENDPOINT is set: ${{ secrets.R2_ENDPOINT != '' }}"
          echo "R2_BUCKET is set: ${{ secrets.R2_BUCKET != '' }}"

      - name: Set variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "r2_key=${{ github.event.client_payload.r2_key }}" >> $GITHUB_OUTPUT
            echo "doc_id=${{ github.event.client_payload.documentary_id }}" >> $GITHUB_OUTPUT
          else
            echo "r2_key=${{ github.event.inputs.r2_key }}" >> $GITHUB_OUTPUT
            echo "doc_id=${{ github.event.inputs.documentary_id }}" >> $GITHUB_OUTPUT
          fi

      - name: Download master video from R2
        run: |
          echo "Downloading ${{ steps.vars.outputs.r2_key }}..."
          aws s3 cp "s3://${{ secrets.R2_BUCKET }}/${{ steps.vars.outputs.r2_key }}" input.mp4 \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}"

      - name: Encode to adaptive HLS
        run: |
          mkdir -p hls
          ffmpeg -y -i input.mp4 \
            -filter_complex \
            "[0:v]split=4[v1][v2][v3][v4]; \
             [v1]scale=w=640:h=360:force_original_aspect_ratio=decrease[v1out]; \
             [v2]scale=w=854:h=480:force_original_aspect_ratio=decrease[v2out]; \
             [v3]scale=w=1280:h=720:force_original_aspect_ratio=decrease[v3out]; \
             [v4]scale=w=1920:h=1080:force_original_aspect_ratio=decrease[v4out]" \
            -map "[v1out]" -c:v:0 libx264 -b:v:0 800k  -maxrate:v:0 856k  -bufsize:v:0 1200k -g 48 -keyint_min 48 -sc_threshold 0 -preset medium \
            -map "[v2out]" -c:v:1 libx264 -b:v:1 1400k -maxrate:v:1 1498k -bufsize:v:1 2100k -g 48 -keyint_min 48 -sc_threshold 0 -preset medium \
            -map "[v3out]" -c:v:2 libx264 -b:v:2 2800k -maxrate:v:2 2996k -bufsize:v:2 4200k -g 48 -keyint_min 48 -sc_threshold 0 -preset medium \
            -map "[v4out]" -c:v:3 libx264 -b:v:3 5000k -maxrate:v:3 5350k -bufsize:v:3 7500k -g 48 -keyint_min 48 -sc_threshold 0 -preset medium \
            -map a:0 -c:a aac -b:a 128k -ac 2 \
            -f hls -hls_time 4 -hls_playlist_type vod -hls_flags independent_segments \
            -master_pl_name master.m3u8 \
            -var_stream_map "v:0,a:0 v:1,a:0 v:2,a:0 v:3,a:0" \
            hls/stream_%v.m3u8

      - name: Upload HLS files to R2
        run: |
          DOC_ID="${{ steps.vars.outputs.doc_id }}"
          aws s3 sync hls/ "s3://${{ secrets.R2_BUCKET }}/documentaries/${DOC_ID}/hls/" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --content-type "application/vnd.apple.mpegurl" \
            --exclude "*" --include "*.m3u8"

          aws s3 sync hls/ "s3://${{ secrets.R2_BUCKET }}/documentaries/${DOC_ID}/hls/" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --content-type "video/mp2t" \
            --exclude "*" --include "*.ts"

      - name: Notify app that encoding is ready
        run: |
          curl -X POST "${{ secrets.APP_WEBHOOK_URL }}/api/webhooks/encoding-complete" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.ENCODING_WEBHOOK_SECRET }}" \
            -d "{
              \"documentaryId\": \"${{ steps.vars.outputs.doc_id }}\",
              \"hlsPlaylistKey\": \"documentaries/${{ steps.vars.outputs.doc_id }}/hls/master.m3u8\",
              \"status\": \"ready\"
            }"
